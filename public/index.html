<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Farm Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pine:#25392f;
    --pine-dark:#182720;
    --gold:#c9922a;
    --gold-soft:#f4e6c4;
    --cream:#f6f2e7;
    --paper:#fffdf7;
    --ink:#2b2620;
    --ink-soft:#6b6455;
    --barn:#9c3f2e;
    --barn-soft:#f6ded7;
    --line:#e2d9c3;
    --green-soft:#dfe9df;
    --shadow: 0 2px 10px rgba(37,57,47,0.08);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-size:17px;
    line-height:1.45;
  }
  .app{max-width:1000px;margin:0 auto;padding:20px 20px 80px;}

  /* Header */
  header.top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    margin-bottom:22px;
    flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:14px;}
  .brand-mark{
    width:52px;height:52px;border-radius:10px;
    background:var(--pine);
    display:flex;align-items:center;justify-content:center;
    font-size:26px;
    box-shadow:var(--shadow);
    flex-shrink:0;
  }
  h1{
    font-family:'Fraunces',serif;
    font-size:28px;
    font-weight:700;
    margin:0;
    color:var(--pine-dark);
  }
  .brand p{margin:2px 0 0;color:var(--ink-soft);font-size:14px;}

  button.primary{
    background:var(--pine);
    color:#fff;
    border:none;
    padding:12px 18px;
    border-radius:9px;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    font-family:'Inter',sans-serif;
    box-shadow:var(--shadow);
  }
  button.primary:hover{background:var(--pine-dark);}
  button.ghost{
    background:transparent;
    border:1.5px solid var(--line);
    color:var(--ink);
    padding:10px 16px;
    border-radius:9px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  button.ghost:hover{border-color:var(--pine);}

  /* Ledger tabs */
  nav.tabs{
    display:flex;
    gap:6px;
    margin-bottom:0;
    overflow-x:auto;
  }
  nav.tabs button{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:17px;
    padding:12px 22px 14px;
    background:var(--gold-soft);
    border:none;
    border-radius:12px 12px 0 0;
    color:var(--pine-dark);
    cursor:pointer;
    position:relative;
    top:2px;
    opacity:0.65;
    white-space:nowrap;
  }
  nav.tabs button.active{
    background:var(--paper);
    opacity:1;
    box-shadow:0 -2px 8px rgba(37,57,47,0.06);
  }
  .panel{
    background:var(--paper);
    border-radius:0 14px 14px 14px;
    padding:26px;
    box-shadow:var(--shadow);
    min-height:400px;
  }

  /* Dashboard */
  .stat-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
    gap:14px;
    margin-bottom:26px;
  }
  .stat-card{
    border-radius:12px;
    padding:18px;
    border:1px solid var(--line);
  }
  .stat-card .num{font-family:'Fraunces',serif;font-size:34px;font-weight:700;line-height:1;}
  .stat-card .label{font-size:14px;color:var(--ink-soft);margin-top:6px;font-weight:500;}
  .stat-card.crops{background:var(--green-soft);}
  .stat-card.crops .num{color:var(--pine);}
  .stat-card.employees{background:var(--gold-soft);}
  .stat-card.employees .num{color:#8a6410;}
  .stat-card.animals{background:#eef1e9;}
  .stat-card.animals .num{color:var(--pine);}
  .stat-card.alert{background:var(--barn-soft);}
  .stat-card.alert .num{color:var(--barn);}
  .stat-card.info{background:#e7edf3;}
  .stat-card.info .num{color:#2b5a8c;}

  .subnav{
    display:flex;
    gap:8px;
    margin-bottom:18px;
    flex-wrap:wrap;
  }
  .subtab-btn{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
    padding:8px 15px;
    background:var(--cream);
    border:1.5px solid var(--line);
    border-radius:999px;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .subtab-btn.active{
    background:var(--pine);
    border-color:var(--pine);
    color:#fff;
  }
  .lowfeed-box{
    background:var(--barn-soft);
    border:1.5px solid var(--barn);
    border-radius:12px;
    padding:14px 18px;
    margin-bottom:26px;
    color:var(--ink);
  }
  .offspring-box{
    background:var(--gold-soft);
    border:1.5px solid var(--gold);
    border-radius:12px;
    padding:12px 18px;
    margin-bottom:20px;
    color:var(--ink);
    font-size:15px;
  }

  h2.section-title{
    font-family:'Fraunces',serif;
    font-size:21px;
    margin:0 0 14px;
    color:var(--pine-dark);
  }
  .empty-note{
    color:var(--ink-soft);
    font-style:italic;
    padding:16px 0;
  }

  /* Section header row */
  .section-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:16px;
  }
  input[type=text], input[type=number], input[type=date], select, textarea{
    width:100%;
    padding:11px 12px;
    border:1.5px solid var(--line);
    border-radius:8px;
    font-size:16px;
    font-family:'Inter',sans-serif;
    color:var(--ink);
    background:#fff;
  }
  input:focus, select:focus, textarea:focus{
    outline:2px solid var(--pine);
    outline-offset:1px;
  }
  label{
    display:block;
    font-size:13px;
    font-weight:600;
    color:var(--ink-soft);
    margin-bottom:5px;
    text-transform:uppercase;
    letter-spacing:0.03em;
  }
  .field{margin-bottom:14px;}
  .form-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:14px 18px;
  }
  form.record-form{
    background:var(--cream);
    border:1.5px dashed var(--line);
    border-radius:12px;
    padding:20px;
    margin-bottom:24px;
  }
  .form-actions{
    display:flex;
    gap:10px;
    margin-top:6px;
  }

  table{width:100%;border-collapse:collapse;}
  th{
    text-align:left;
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:0.03em;
    color:var(--ink-soft);
    padding:10px 10px;
    border-bottom:2px solid var(--line);
  }
  td{
    padding:12px 10px;
    border-bottom:1px solid var(--line);
    font-size:15.5px;
    vertical-align:top;
  }
  tr:hover td{background:#faf8f1;}
  .pill{
    display:inline-block;
    padding:4px 11px;
    border-radius:999px;
    font-size:13px;
    font-weight:600;
  }
  .pill.status-ready, .pill.status-active, .pill.status-healthy{background:var(--green-soft);color:var(--pine);}
  .pill.status-growing, .pill.status-planted, .pill.status-onleave{background:var(--gold-soft);color:#8a6410;}
  .pill.status-harvested, .pill.status-inactive, .pill.status-sold, .pill.status-deceased{background:#e9e6dd;color:var(--ink-soft);}
  .pill.status-needsattention, .pill.status-sick{background:var(--barn-soft);color:var(--barn);}
  .pill.status-ok{background:var(--green-soft);color:var(--pine);}
  .pill.status-buysoon{background:var(--barn-soft);color:var(--barn);}
  .pill.status-good{background:var(--green-soft);color:var(--pine);}
  .pill.status-needsmaintenance{background:var(--barn-soft);color:var(--barn);}
  .pill.status-underrepair{background:var(--gold-soft);color:#8a6410;}
  .pill.status-outofservice{background:#e9e6dd;color:var(--ink-soft);}

  .row-actions{display:flex;gap:8px;}
  .icon-btn{
    border:none;
    background:transparent;
    cursor:pointer;
    font-size:16px;
    padding:6px 9px;
    border-radius:7px;
  }
  .icon-btn:hover{background:var(--cream);}
  .table-wrap{overflow-x:auto;}

  footer.appfoot{
    text-align:center;
    color:var(--ink-soft);
    font-size:13px;
    margin-top:30px;
  }
  .toast{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%);
    background:var(--pine-dark);
    color:#fff;
    padding:12px 20px;
    border-radius:10px;
    font-size:15px;
    box-shadow:0 4px 16px rgba(0,0,0,0.2);
    opacity:0;
    pointer-events:none;
    transition:opacity 0.25s ease;
    z-index:50;
  }
  .toast.show{opacity:1;}

  @media (max-width:520px){
    h1{font-size:22px;}
    .panel{padding:16px;}
    nav.tabs button{padding:10px 14px 12px;font-size:15px;}
  }
</style>
</head>
<body>
<div class="app">

  <header class="top">
    <div class="brand">
      <div class="brand-mark">🌾</div>
      <div>
        <h1>Farm Ledger</h1>
        <p>Crops, employees, animals, milk, sales &amp; feed — all in one place</p>
      </div>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button data-tab="dashboard" class="active">Dashboard</button>
    <button data-tab="crops">🌽 Crops</button>
    <button data-tab="employees">👩‍🌾 Employees</button>
    <button data-tab="animals">🐄 Animals</button>
    <button data-tab="feed">🌾 Feed Stock</button>
    <button data-tab="supplements">💊 Supplements</button>
    <button data-tab="tools">🔧 Tools</button>
  </nav>

  <div class="panel">
    <div id="loadingNote" class="empty-note">Loading your records…</div>
    <div id="views" style="display:none;"></div>
  </div>

  <footer class="appfoot">Records are saved automatically to the server as you go.</footer>
</div>

<div class="toast" id="toast"></div>

<script>
/* ---------------- Storage helpers ---------------- */
const STORE_KEYS = { crops:'farm-crops', employees:'farm-employees', cows:'farm-cows', pigs:'farm-pigs',
  milk:'farm-milk', births:'farm-births', sales:'farm-sales', feed:'farm-feed', feedLog:'farm-feedlog',
  hay:'farm-hay', hayLog:'farm-haylog', supplements:'farm-supplements', tools:'farm-tools' };
let DATA = { crops: [], employees: [], cows: [], pigs: [], milk: [], births: [], sales: [], feed: [], feedLog: [],
  hay: [], hayLog: [], supplements: [], tools: [] };

async function loadAll(){
  try{
    const res = await fetch('/api/data');
    const all = res.ok ? await res.json() : {};
    for(const kind of Object.keys(STORE_KEYS)){
      const raw = all[STORE_KEYS[kind]];
      DATA[kind] = raw ? (typeof raw === 'string' ? JSON.parse(raw) : raw) : [];
    }
  }catch(e){
    for(const kind of Object.keys(STORE_KEYS)) DATA[kind] = [];
    showToast("Couldn't reach the server — showing an empty board.");
  }
}
async function saveKind(kind){
  try{
    const res = await fetch('/api/data', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ key: STORE_KEYS[kind], value: JSON.stringify(DATA[kind]) })
    });
    if(!res.ok) throw new Error('save failed');
  }catch(e){
    showToast("Couldn't save — check your connection and try again.");
  }
}

function uid(){ return 'id-' + Date.now() + '-' + Math.random().toString(36).slice(2,8); }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h = setTimeout(()=>t.classList.remove('show'), 2200);
}
function slug(s){ return (s||'').toString().toLowerCase().replace(/[^a-z]/g,''); }
const ADULT_AGE_LABELS = new Set(['Adult','Finisher','Sow','Boar']);
const OFFSPRING_AGE_LABELS = new Set(['Offspring','Piglet','Weaner','Grower']);
function ageBucket(value){
  if(ADULT_AGE_LABELS.has(value)) return 'Adult';
  if(OFFSPRING_AGE_LABELS.has(value)) return 'Offspring';
  return null;
}

// Pig gestation is ~114 days ("3 months, 3 weeks, 3 days": 90 + 21 + 3).
function computeExpectedFarrowing(dateServed){
  if(!dateServed) return '';
  const d = new Date(dateServed + 'T00:00:00');
  if(isNaN(d)) return '';
  d.setDate(d.getDate() + 114);
  return d.toISOString().slice(0,10);
}

// Finds the most recent logged birth for a given sow tag.
function findLatestFarrowing(pigTag){
  if(!pigTag) return null;
  const records = DATA.births.filter(b=> b.motherTag === pigTag && b.animalType === 'Pig' && b.date);
  if(!records.length) return null;
  return records.reduce((a,b)=> a.date > b.date ? a : b).date;
}

// Breastfeeding is ~2 months, then a 3-week break, then a 1-week serving
// window before she's taken back to the boar.
function computeNextServingWindow(pigTag){
  const farrowDate = findLatestFarrowing(pigTag);
  if(!farrowDate) return null;
  const weaning = new Date(farrowDate + 'T00:00:00');
  if(isNaN(weaning)) return null;
  weaning.setMonth(weaning.getMonth() + 2);
  const windowStart = new Date(weaning); windowStart.setDate(windowStart.getDate() + 21);
  const windowEnd = new Date(windowStart); windowEnd.setDate(windowEnd.getDate() + 7);
  return {
    weaning: weaning.toISOString().slice(0,10),
    windowStart: windowStart.toISOString().slice(0,10),
    windowEnd: windowEnd.toISOString().slice(0,10)
  };
}

function isDueSoon(dateStr, days){
  if(!dateStr) return false;
  const d = new Date(dateStr + 'T00:00:00');
  if(isNaN(d)) return false;
  const today = new Date(); today.setHours(0,0,0,0);
  const cutoff = new Date(today); cutoff.setDate(cutoff.getDate() + (days===undefined?7:days));
  return d <= cutoff;
}
function fmtDate(d){
  if(!d) return '—';
  const dt = new Date(d + 'T00:00:00');
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'});
}

/* ---------------- Field configs per record type ---------------- */
const CONFIG = {
  crops: {
    title: 'Crops', icon:'🌽', addLabel:'Add a crop',
    columns: [
      {key:'name', label:'Crop', type:'text', required:true},
      {key:'field', label:'Field / plot', type:'text'},
      {key:'planted', label:'Date planted', type:'date'},
      {key:'harvest', label:'Expected harvest', type:'date'},
      {key:'area', label:'Area (acres)', type:'number'},
      {key:'status', label:'Status', type:'select', options:['Planted','Growing','Ready to Harvest','Harvested']},
      {key:'lastSprayed', label:'Last sprayed', type:'date'},
      {key:'nextSpray', label:'Next spray due', type:'date'},
      {key:'sprayUsed', label:'Spray / chemical used', type:'text'},
      {key:'notes', label:'Notes', type:'textarea'}
    ],
    tableCols: ['name','field','planted','harvest','status','lastSprayed','nextSpray'],
    statusKey: 'status',
    dueKey: 'nextSpray'
  },
  employees: {
    title:'Employees', icon:'👩‍🌾', addLabel:'Add an employee',
    columns: [
      {key:'name', label:'Full name', type:'text', required:true},
      {key:'role', label:'Role', type:'text'},
      {key:'phone', label:'Phone number', type:'text'},
      {key:'start', label:'Start date', type:'date'},
      {key:'status', label:'Status', type:'select', options:['Active','On Leave','Inactive']},
      {key:'notes', label:'Notes', type:'textarea'}
    ],
    tableCols: ['name','role','phone','start','status'],
    statusKey: 'status'
  },
  cows: {
    title:'Cows', icon:'🐄', addLabel:'Add a cow',
    columns: [
      {key:'tag', label:'Tag / ID', type:'text', required:true},
      {key:'breed', label:'Breed / grade', type:'select', options:['Friesian','Ayrshire','Guernsey','Jersey','Sahiwal','Boran','Zebu','Crossbreed','Other']},
      {key:'ageGroup', label:'Age group', type:'select', options:['Adult','Offspring']},
      {key:'qty', label:'Quantity', type:'number'},
      {key:'health', label:'Health status', type:'select', options:['Healthy','Needs Attention','Sick','Sold','Deceased']},
      {key:'checkup', label:'Last checkup', type:'date'},
      {key:'nextCheckup', label:'Next checkup due', type:'date'},
      {key:'vaccines', label:'Vaccines given', type:'text'},
      {key:'medicine', label:'Medicine given', type:'text'},
      {key:'notes', label:'Notes', type:'textarea'}
    ],
    tableCols: ['tag','breed','ageGroup','qty','health','vaccines','medicine','nextCheckup'],
    statusKey: 'health',
    dueKey: 'nextCheckup'
  },
  pigs: {
    title:'Pigs', icon:'🐖', addLabel:'Add a pig',
    columns: [
      {key:'tag', label:'Tag / ID', type:'text', required:true},
      {key:'ageGroup', label:'Age group', type:'select', options:['Piglet','Weaner','Grower','Finisher','Sow','Boar']},
      {key:'feedStage', label:'Feed stage', type:'select', options:['Starter','Grower','Fattener']},
      {key:'feedStageDate', label:'On this feed since', type:'date'},
      {key:'qty', label:'Quantity', type:'number'},
      {key:'health', label:'Health status', type:'select', options:['Healthy','Needs Attention','Sick','Sold','Deceased']},
      {key:'nursingPiglets', label:'Piglets nursing (for a sow)', type:'number'},
      {key:'dateServed', label:'Date served (taken to boar)', type:'date'},
      {key:'checkup', label:'Last checkup', type:'date'},
      {key:'nextCheckup', label:'Next checkup due', type:'date'},
      {key:'vaccines', label:'Vaccines given', type:'text'},
      {key:'medicine', label:'Medicine given', type:'text'},
      {key:'notes', label:'Notes', type:'textarea'}
    ],
    tableCols: ['tag','ageGroup','feedStage','qty','health','nursingPiglets','dateServed','expectedFarrowing','nextServingWindow'],
    statusKey: 'health',
    dueKey: 'nextCheckup',
    computedCols: [
      {
        key: 'expectedFarrowing', label: 'Expected Farrowing',
        fn: item => {
          const raw = computeExpectedFarrowing(item.dateServed);
          return { display: raw ? fmtDate(raw) : '—', dueDate: raw || null };
        }
      },
      {
        key: 'nextServingWindow', label: 'Next Serving Window',
        fn: item => {
          const w = computeNextServingWindow(item.tag);
          if(!w) return { display: '—', dueDate: null };
          return { display: fmtDate(w.windowStart) + ' – ' + fmtDate(w.windowEnd), dueDate: w.windowStart };
        }
      }
    ]
  },
  milk: {
    title:'Milk Log', icon:'🥛', addLabel:'Log milk production',
    columns: [
      {key:'date', label:'Date', type:'date', required:true},
      {key:'session', label:'Session', type:'select', options:['Morning','Afternoon','Evening'], required:true},
      {key:'animalTag', label:'Cow / tag', type:'select', dynamicOptions: ()=>DATA.cows.map(c=>c.tag).filter(Boolean)},
      {key:'liters', label:'Liters produced', type:'number'},
      {key:'notes', label:'Notes', type:'textarea'}
    ],
    tableCols: ['date','session','animalTag','liters']
  },
  births: {
    title:'Births', icon:'🐣', addLabel:'Log a birth',
    columns: [
      {key:'date', label:'Date', type:'date', required:true},
      {key:'motherTag', label:'Mother / tag', type:'text'},
      {key:'animalType', label:'Animal', type:'select', options:['Cow','Pig']},
      {key:'offspring', label:'Number born', type:'number'},
      {key:'notes', label:'Notes', type:'textarea'}
    ],
    tableCols: ['date','motherTag','animalType','offspring']
  },
  sales: {
    title:'Sales', icon:'💰', addLabel:'Log a sale',
    columns: [
      {key:'date', label:'Date', type:'date', required:true},
      {key:'animalType', label:'Animal', type:'select', options:['Cow','Pig']},
      {key:'ageGroup', label:'Age group', type:'select', options:['Adult','Offspring']},
      {key:'qty', label:'Quantity sold', type:'number'},
      {key:'amount', label:'Amount earned (KSh)', type:'number'},
      {key:'buyer', label:'Buyer', type:'text'},
      {key:'notes', label:'Notes', type:'textarea'}
    ],
    tableCols: ['date','animalType','ageGroup','qty','amount','buyer']
  },
  feed: {
    title:'Feed Stock', icon:'🌾', addLabel:'Add a feed type',
    columns: [
      {key:'name', label:'Feed name', type:'text', required:true},
      {key:'quantity', label:'Starting quantity (kg)', type:'number'},
      {key:'reorderLevel', label:'Reorder level (kg)', type:'number', default:5},
      {key:'notes', label:'Notes', type:'textarea'}
    ]
  },
  hay: {
    title:'Hay', icon:'🌿', addLabel:'Add a hay type',
    columns: [
      {key:'name', label:'Hay type', type:'text', required:true},
      {key:'quantity', label:'Starting quantity', type:'number'},
      {key:'unit', label:'Unit (bales, kg)', type:'text'},
      {key:'reorderLevel', label:'Reorder level', type:'number', default:5},
      {key:'notes', label:'Notes', type:'textarea'}
    ]
  },
  supplements: {
    title:'Supplements', icon:'💊', addLabel:'Add a supplement',
    columns: [
      {key:'name', label:'Supplement name', type:'text', required:true},
      {key:'usage', label:'Used for', type:'text'},
      {key:'dosage', label:'Dosage / how to use', type:'text'},
      {key:'quantity', label:'Quantity available', type:'number'},
      {key:'unit', label:'Unit', type:'text'},
      {key:'notes', label:'Notes', type:'textarea'}
    ],
    tableCols: ['name','usage','dosage','quantity','unit']
  },
  tools: {
    title:'Tools & Equipment', icon:'🔧', addLabel:'Add a tool',
    columns: [
      {key:'name', label:'Tool / equipment', type:'text', required:true},
      {key:'condition', label:'Condition', type:'select', options:['Good','Needs Maintenance','Under Repair','Out of Service']},
      {key:'lastService', label:'Last maintenance', type:'date'},
      {key:'nextService', label:'Next maintenance due', type:'date'},
      {key:'notes', label:'Notes', type:'textarea'}
    ],
    tableCols: ['name','condition','lastService','nextService'],
    statusKey: 'condition',
    dueKey: 'nextService'
  }
};

const FEED_GROUPS = {

};

const ANIMAL_SUBTABS = [
  {key:'cows', label:'Cows'},
  {key:'pigs', label:'Pigs'},
  {key:'milk', label:'Milk Log'},
  {key:'births', label:'Births'},
  {key:'sales', label:'Sales'}
];

const FEED_SUBTABS = [
  {key:'feed', label:'🌾 Feed (kg)'},
  {key:'hay', label:'🌿 Hay'}
];

let editingId = { crops:null, employees:null, cows:null, pigs:null, milk:null, births:null, sales:null,

let formOpen = { crops:false, employees:false, cows:false, pigs:false, milk:false, births:false, sales:false,

let currentTab = 'dashboard';
let animalSubTab = 'cows';
let feedGroup = 'feed';
let feedAction = null;

function activeKind(){
  if(currentTab === 'animals') return animalSubTab;
  if(currentTab === 'feed') return feedGroup;

/* ---------------- Rendering ---------------- */
function render(){
  const root = document.getElementById('views');
  if(currentTab === 'dashboard'){ root.innerHTML = renderDashboard(); }
  else if(currentTab === 'animals'){ root.innerHTML = renderAnimalsHub(); }
  else if(currentTab === 'feed'){ root.innerHTML = renderFeedHub(); }
  else { root.innerHTML = renderRecordView(currentTab); }
  attachHandlers();
}

function renderAnimalsHub(){
  let html = `<div class="subnav">`;
  ANIMAL_SUBTABS.forEach(t=>{
    html += `<button class="subtab-btn${t.key===animalSubTab ? ' active' : ''}" data-subtab="${t.key}">${t.label}</button>`;
  });
  html += `</div>`;
  html += renderRecordView(animalSubTab);
  return html;
}

function renderFeedHub(){
  let html = `<div class="subnav">`;
  FEED_SUBTABS.forEach(t=>{
    html += `<button class="subtab-btn feedgroup-btn${t.key===feedGroup ? ' active' : ''}" data-feedgroup="${t.key}">${t.label}</button>`;
  });
  html += `</div>`;
  html += renderFeedView(feedGroup);
  return html;
}

function renderDashboard(){
  const c = DATA.crops, e = DATA.employees, a = [...DATA.cows, ...DATA.pigs], f = DATA.feed, h = DATA.hay, tl = DATA.tools;
  const readyToHarvest = c.filter(x=>x.status==='Ready to Harvest').length;
  const activeEmp = e.filter(x=>x.status==='Active').length;
  const totalAnimals = a.reduce((s,x)=> s + (parseFloat(x.qty)||0), 0);
  const totalAdults = a.filter(x=>ageBucket(x.ageGroup)==='Adult').reduce((s,x)=> s + (parseFloat(x.qty)||0), 0);
  const totalOffspring = a.filter(x=>ageBucket(x.ageGroup)==='Offspring').reduce((s,x)=> s + (parseFloat(x.qty)||0), 0);
  const needsAttention = a.filter(x=>x.health==='Needs Attention' || x.health==='Sick').length;
  const sprayDue = c.filter(x=>isDueSoon(x.nextSpray)).length;

  const breedingSoonList = DATA.pigs.filter(p=>{
    const w = computeNextServingWindow(p.tag);
    return w && isDueSoon(w.windowStart);

  const farrowingSoon = farrowingSoonList.length;
  const breedingSoon = breedingSoonList.length;

  const today = new Date(); today.setHours(0,0,0,0);
  const weekAgo = new Date(today); weekAgo.setDate(weekAgo.getDate()-6);
  const milkThisWeek = DATA.milk.filter(x=>{
    const d = new Date(x.date+'T00:00:00'); return !isNaN(d) && d >= weekAgo && d <= today;
  }).reduce((s,x)=> s + (parseFloat(x.liters)||0), 0);

  const monthStart = new Date(today.getFullYear(), today.getMonth(), 1);
  const salesThisMonth = DATA.sales.filter(x=>{
    const d = new Date(x.date+'T00:00:00'); return !isNaN(d) && d >= monthStart && d <= today;
  }).reduce((s,x)=> s + (parseFloat(x.amount)||0), 0);

  const lowFeed = f.filter(x=> (parseFloat(x.quantity)||0) <= (parseFloat(x.reorderLevel)||0));
  const lowHay = h.filter(x=> (parseFloat(x.quantity)||0) <= (parseFloat(x.reorderLevel)||0));
  const feedUsedWeek = DATA.feedLog.filter(t=>{
    if(t.type !== 'Stock Out') return false;
    const d = new Date(t.date+'T00:00:00'); return !isNaN(d) && d >= weekAgo && d <= today;
  }).reduce((s,t)=> s + (parseFloat(t.quantity)||0), 0);
  const feedSpendMonth = DATA.feedLog.filter(t=>{
    if(t.type !== 'Stock In') return false;
    const d = new Date(t.date+'T00:00:00'); return !isNaN(d) && d >= monthStart && d <= today;
  }).reduce((s,t)=> s + (parseFloat(t.cost)||0), 0);
  const toolsNeedingAttention = tl.filter(x=> x.condition==='Needs Maintenance' || x.condition==='Under Repair' || x.condition==='Out of Service' || isDueSoon(x.nextService)).length;

  let html = `<h2 class="section-title">Today at a glance</h2>
  <div class="stat-grid">
    <div class="stat-card crops"><div class="num">${c.length}</div><div class="label">Crops logged</div></div>
    <div class="stat-card crops"><div class="num">${readyToHarvest}</div><div class="label">Ready to harvest</div></div>
    <div class="stat-card alert"><div class="num">${sprayDue}</div><div class="label">Crops due for spraying (7 days)</div></div>
    <div class="stat-card employees"><div class="num">${activeEmp}</div><div class="label">Active employees</div></div>
    <div class="stat-card animals"><div class="num">${totalAnimals}</div><div class="label">Animals (head count)</div></div>
    <div class="stat-card animals"><div class="num">${totalAdults}</div><div class="label">Adults</div></div>
    <div class="stat-card animals"><div class="num">${totalOffspring}</div><div class="label">Offspring / newborns</div></div>
    <div class="stat-card alert"><div class="num">${needsAttention}</div><div class="label">Animals needing attention</div></div>
    <div class="stat-card alert"><div class="num">${checkupDue}</div><div class="label">Checkups due (7 days)</div></div>
    <div class="stat-card alert"><div class="num">${farrowingSoon}</div><div class="label">Sows farrowing soon (7 days)</div></div>
    <div class="stat-card alert"><div class="num">${breedingSoon}</div><div class="label">Sows ready to breed soon (7 days)</div></div>
    <div class="stat-card info"><div class="num">${milkThisWeek}L</div><div class="label">Milk this week</div></div>
    <div class="stat-card info"><div class="num">${salesThisMonth.toLocaleString()}</div><div class="label">Sales this month (KSh)</div></div>
    <div class="stat-card alert"><div class="num">${lowFeed.length}</div><div class="label">Feed items to restock (kg)</div></div>
    <div class="stat-card alert"><div class="num">${lowHay.length}</div><div class="label">Hay items to restock</div></div>
    <div class="stat-card info"><div class="num">${feedUsedWeek}</div><div class="label">Feed used this week (kg)</div></div>
    <div class="stat-card info"><div class="num">${feedSpendMonth.toLocaleString()}</div><div class="label">Feed spend this month (KSh)</div></div>
    <div class="stat-card alert"><div class="num">${toolsNeedingAttention}</div><div class="label">Tools needing attention</div></div>
  </div>`;

  if(lowFeed.length){
    html += `<div class="lowfeed-box"><strong>⚠️ Feed running low — buy soon:</strong>
      <ul style="margin:8px 0 0;padding-left:20px;">
        ${lowFeed.map(x=>`<li>${escapeHtml(x.name)} — ${escapeHtml(x.quantity)} kg left</li>`).join('')}
      </ul></div>`;
  }
  if(lowHay.length){
    html += `<div class="lowfeed-box"><strong>⚠️ Hay running low — buy soon:</strong>
      <ul style="margin:8px 0 0;padding-left:20px;">
        ${lowHay.map(x=>`<li>${escapeHtml(x.name)} — ${escapeHtml(x.quantity)} ${escapeHtml(x.unit||'')} left</li>`).join('')}
      </ul></div>`;
  }
  if(farrowingSoonList.length){
    html += `<div class="offspring-box"><strong>🐖 Sows farrowing soon:</strong>
      <ul style="margin:8px 0 0;padding-left:20px;">
        ${farrowingSoonList.map(p=>`<li>${escapeHtml(p.tag)} — expected ${fmtDate(computeExpectedFarrowing(p.dateServed))}</li>`).join('')}
      </ul></div>`;
  }
  if(breedingSoonList.length){
    html += `<div class="offspring-box"><strong>🐖 Sows ready to breed soon:</strong>
      <ul style="margin:8px 0 0;padding-left:20px;">
        ${breedingSoonList.map(p=>{
          const w = computeNextServingWindow(p.tag);
          return `<li>${escapeHtml(p.tag)} — window ${fmtDate(w.windowStart)} – ${fmtDate(w.windowEnd)}</li>`;
        }).join('')}
      </ul></div>`;

  html += `<h2 class="section-title">Quick look</h2>`;
  html += renderQuickList('crops', 'Crops', 3);
  html += renderQuickList('employees', 'Employees', 3);
  html += renderQuickList('cows', 'Cows', 3);
  html += renderQuickList('pigs', 'Pigs', 3);
  html += renderMilkSalesBirthsQuickLists();
  return html;
}

    html += `<div style="margin-bottom:16px;"><strong>Milk Log</strong><ul style="margin:8px 0 0;padding-left:20px;">
      ${milk.map(x=>`<li>${fmtDate(x.date)} (${escapeHtml(x.session||'—')}) — ${escapeHtml(x.animalTag||'—')}: ${escapeHtml(x.liters)}L</li>`).join('')}

      ${births.map(x=>`<li>${fmtDate(x.date)} — ${escapeHtml(x.motherTag||'—')} (${escapeHtml(x.animalType||'')}): ${escapeHtml(x.offspring)} born</li>`).join('')}

function renderQuickList(kind, label, limit){
  const items = DATA[kind].slice(-limit).reverse();
  if(items.length === 0){
    return `<p class="empty-note">No ${label.toLowerCase()} added yet. Go to the ${label} tab to add one.</p>`;
  }
  const cfg = CONFIG[kind];
  const nameKey = cfg.columns[0].key;
  const rows = items.map(it => `<li>${escapeHtml(it[nameKey]||'(unnamed)')}${it[cfg.statusKey] ? ' — ' + statusPill(cfg, it[cfg.statusKey]) : ''}</li>`).join('');
  return `<div style="margin-bottom:16px;"><strong>${label}</strong><ul style="margin:8px 0 0;padding-left:20px;">${rows}</ul></div>`;
}

function statusPill(cfg, value){
  if(!value) return '';
  return `<span class="pill status-${slug(value)}">${escapeHtml(value)}</span>`;
}

function escapeHtml(s){
  return (s===undefined||s===null?'':String(s)).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function offspringSummary(animalType){
  const born = DATA.births.filter(b=>b.animalType===animalType).reduce((s,b)=> s + (parseFloat(b.offspring)||0), 0);
  const sold = DATA.sales.filter(x=>x.animalType===animalType && x.ageGroup==='Offspring').reduce((s,x)=> s + (parseFloat(x.qty)||0), 0);
  return { born, sold, remaining: Math.max(0, born - sold) };
}

function renderRecordView(kind){
  const cfg = CONFIG[kind];
  const items = DATA[kind];
  let html = `<div class="section-head">
    <h2 class="section-title">${cfg.icon} ${cfg.title}</h2>
    <button class="primary" id="toggleFormBtn">${formOpen[kind] ? '✕ Close' : '+ ' + cfg.addLabel}</button>
  </div>`;

  if(kind === 'cows' || kind === 'pigs'){
    const os = offspringSummary(kind === 'cows' ? 'Cow' : 'Pig');
    html += `<div class="offspring-box">🐣 <strong>Newborns:</strong> ${os.born} born · ${os.sold} sold · <strong>${os.remaining} remaining</strong></div>`;
  }

  if(formOpen[kind]){
    html += renderForm(kind);
  }

  if(items.length === 0){
    html += `<p class="empty-note">Nothing here yet. Use "${cfg.addLabel}" above to add your first record.</p>`;
  } else {
    html += `<div class="table-wrap"><table><thead><tr>`;
    cfg.tableCols.forEach(colKey=>{
      const cc = cfg.computedCols && cfg.computedCols.find(c=>c.key===colKey);
      if(cc){ html += `<th>${cc.label}</th>`; return; }
      const col = cfg.columns.find(c=>c.key===colKey);
      html += `<th>${col.label}</th>`;
    });
    html += `<th></th></tr></thead><tbody>`;
    items.forEach(item=>{
      html += `<tr>`;
      cfg.tableCols.forEach(colKey=>{
        const cc = cfg.computedCols && cfg.computedCols.find(c=>c.key===colKey);
        if(cc){
          const result = cc.fn(item) || {};
          const display = result.display || '—';
          const due = result.dueDate && isDueSoon(result.dueDate);
          html += `<td>${due ? '<span class="pill status-needsattention">' + display + '</span>' : display}</td>`;
          return;
        }
        const col = cfg.columns.find(c=>c.key===colKey);
        let val = item[colKey];
        if(colKey === cfg.statusKey){
          html += `<td>${statusPill(cfg, val)}</td>`;
        } else if(col.type === 'date'){
          const due = colKey === cfg.dueKey && isDueSoon(val);
          html += `<td>${due ? '<span class="pill status-needsattention">' + fmtDate(val) + '</span>' : fmtDate(val)}</td>`;
        } else {
          html += `<td>${escapeHtml(val)}</td>`;
        }
      });
      html += `<td><div class="row-actions">
        <button class="icon-btn edit-btn" data-id="${item.id}" title="Edit">✏️</button>
        <button class="icon-btn delete-btn" data-id="${item.id}" title="Delete">🗑️</button>
      </div></td></tr>`;
    });
    html += `</tbody></table></div>`;
  }
  return html;
}

function computeFeedStatus(item){
  return (parseFloat(item.quantity)||0) <= (parseFloat(item.reorderLevel)||0) ? 'Buy Soon' : 'OK';
}

function estimateDaysLeft(item, logKey){
  const outs = DATA[logKey].filter(t=>t.feedId===item.id && t.type==='Stock Out' && t.date);
  if(outs.length < 2) return null;
  const dates = outs.map(t=>new Date(t.date+'T00:00:00')).filter(d=>!isNaN(d));
  if(dates.length < 2) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const minDate = new Date(Math.min(...dates));
  const spanDays = Math.max(1, Math.round((today - minDate)/86400000));
  const totalUsed = outs.reduce((s,t)=> s + (parseFloat(t.quantity)||0), 0);
  const perDay = totalUsed / spanDays;
  if(perDay <= 0) return null;
  return Math.max(0, Math.floor((parseFloat(item.quantity)||0) / perDay));
}

function renderFeedView(group){
  const g = FEED_GROUPS[group];
  const cfg = CONFIG[group];
  const dataKey = g.dataKey, logKey = g.logKey;
  let html = `<div class="section-head">
    <h2 class="section-title">${cfg.icon} ${cfg.title}</h2>
    <button class="primary" id="toggleFormBtn">${formOpen[group] ? '✕ Close' : '+ ' + cfg.addLabel}</button>
  </div>`;

  if(formOpen[group]){ html += renderForm(group); }
  if(feedAction && feedAction.group === group){ html += renderFeedActionForm(group); }

  const items = DATA[dataKey];
  if(items.length === 0){
    html += `<p class="empty-note">No ${cfg.title.toLowerCase()} items yet. Use "${cfg.addLabel}" above to add your first one.</p>`;
  } else {
    html += `<div class="table-wrap"><table><thead><tr>
      <th>${cfg.title === 'Hay' ? 'Hay' : 'Feed'}</th><th>Remaining</th><th>Reorder Level</th><th>Status</th><th>Est. days left</th><th></th>
    </tr></thead><tbody>`;
    items.forEach(item=>{
      const status = computeFeedStatus(item);
      const daysLeft = estimateDaysLeft(item, logKey);
      const unit = g.unitFixed || item.unit || '';
      html += `<tr>
        <td>${escapeHtml(item.name)}</td>
        <td>${escapeHtml(item.quantity)} ${escapeHtml(unit)}</td>
        <td>${escapeHtml(item.reorderLevel)} ${escapeHtml(unit)}</td>
        <td>${statusPill(cfg, status)}</td>
        <td>${daysLeft===null ? '—' : '~' + daysLeft + ' days'}</td>
        <td><div class="row-actions">
          <button class="icon-btn feedout-btn" data-id="${item.id}" data-group="${group}" title="Take out">➖</button>
          <button class="icon-btn feedin-btn" data-id="${item.id}" data-group="${group}" title="Restock">➕</button>
          <button class="icon-btn edit-btn" data-id="${item.id}" title="Edit">✏️</button>
          <button class="icon-btn delete-btn" data-id="${item.id}" title="Delete">🗑️</button>
        </div></td>
      </tr>`;
    });
    html += `</tbody></table></div>`;
  }

  html += renderFeedLogSection(group);
  return html;
}

  const g = FEED_GROUPS[group];

  if(!item) return '';
  const isOut = feedAction.mode === 'out';
  const unit = g.unitFixed || item.unit || 'units';
  const employeeOptions = DATA.employees.map(e=>`<option value="${escapeHtml(e.name)}">`).join('');
  return `<form class="record-form" id="feedActionForm" data-mode="${feedAction.mode}" data-feedid="${item.id}" data-group="${group}">
    <h3 style="margin:0 0 14px;font-family:'Fraunces',serif;color:var(--pine-dark);">
      ${isOut ? '➖ Take out' : '➕ Restock'}: ${escapeHtml(item.name)}
      <span style="font-size:14px;color:var(--ink-soft);font-weight:400;"> (currently ${escapeHtml(item.quantity)} ${escapeHtml(unit)})</span>
    </h3>
    <div class="form-grid">
      <div class="field"><label>Amount (${escapeHtml(unit)}) *</label><input type="number" step="any" id="fa_amount" required></div>

      ${isOut
        ? `<div class="field"><label>Purpose</label><input type="text" id="fa_notes" placeholder="e.g. fed to dairy cows"></div>`
        : `<div class="field"><label>Cost (KSh)</label><input type="number" step="any" id="fa_cost"></div>
           <div class="field"><label>Supplier / Notes</label><input type="text" id="fa_notes"></div>`}
    </div>
    <datalist id="employeeList">${employeeOptions}</datalist>
    <div class="form-actions">
      <button type="submit" class="primary">${isOut ? 'Record take-out' : 'Record restock'}</button>
      <button type="button" class="ghost" id="cancelFeedActionBtn">Cancel</button>
    </div>

function renderFeedLogSection(group){
  const g = FEED_GROUPS[group];
  const log = DATA[g.logKey].slice(-30).reverse();
  let html = `<h2 class="section-title" style="margin-top:28px;">${CONFIG[group].title} Transaction Log</h2>`;
  if(log.length === 0){
    html += `<p class="empty-note">No transactions recorded yet — use "Take out" or "Restock" above.</p>`;
    return html;
  }
  html += `<div class="table-wrap"><table><thead><tr>
    <th>Date</th><th>Item</th><th>Type</th><th>Amount</th><th>Employee</th><th>Notes</th>
  </tr></thead><tbody>`;
  log.forEach(t=>{
    html += `<tr>
      <td>${fmtDate(t.date)}</td>
      <td>${escapeHtml(t.feedName)}</td>
      <td><span class="pill status-${t.type==='Stock In' ? 'ok' : 'buysoon'}">${t.type}</span></td>
      <td>${escapeHtml(t.quantity)}</td>
      <td>${escapeHtml(t.employee || '—')}</td>
      <td>${escapeHtml(t.notes||'')}${t.cost ? ' · KSh ' + Number(t.cost).toLocaleString() : ''}</td>
    </tr>`;
  });
  html += `</tbody></table></div>`;
  if(DATA[g.logKey].length > 30){
    html += `<p class="empty-note">Showing the most recent 30 transactions.</p>`;
  }
  return html;
}

function renderForm(kind){
  const cfg = CONFIG[kind];
  const editing = editingId[kind];
  const existing = editing ? DATA[kind].find(x=>x.id===editing) : null;
  let html = `<form class="record-form" id="recordForm" data-kind="${kind}"><div class="form-grid">`;
  cfg.columns.forEach(col=>{
    const val = existing ? (existing[col.key] ?? '') : (col.default !== undefined ? col.default : '');
    html += `<div class="field${col.type==='textarea' ? ' full' : ''}" style="${col.type==='textarea' ? 'grid-column:1/-1;' : ''}">
      <label for="f_${col.key}">${col.label}${col.required ? ' *' : ''}</label>`;
    if(col.type === 'select'){
      const opts = col.options || (col.dynamicOptions ? col.dynamicOptions() : []);
      html += `<select id="f_${col.key}" name="${col.key}">
        <option value="">— Select —</option>
        ${opts.map(o=>`<option value="${o}" ${val===o?'selected':''}>${o}</option>`).join('')}
      </select>`;
      if(col.dynamicOptions && opts.length === 0){
        html += `<div style="font-size:12px;color:var(--ink-soft);margin-top:4px;">No options yet — add one first, then come back.</div>`;
      }
    } else if(col.type === 'textarea'){
      html += `<textarea id="f_${col.key}" name="${col.key}" rows="2">${escapeHtml(val)}</textarea>`;
    } else {
      html += `<input type="${col.type}" id="f_${col.key}" name="${col.key}" value="${escapeHtml(val)}" ${col.required?'required':''}>`;
    }
    html += `</div>`;
  });
  html += `</div><div class="form-actions">
    <button type="submit" class="primary">${existing ? 'Save changes' : 'Add ' + cfg.title.toLowerCase().replace(/s$/,'')}</button>
    <button type="button" class="ghost" id="cancelFormBtn">Cancel</button>
  </div></form>`;
  return html;
}

/* ---------------- Event handling ---------------- */
function attachHandlers(){
  document.querySelectorAll('.subtab-btn:not(.feedgroup-btn)').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      animalSubTab = btn.dataset.subtab;
      render();
    });
  });
  document.querySelectorAll('.feedgroup-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      feedGroup = btn.dataset.feedgroup;
      feedAction = null;
      render();
    });
  });
  document.querySelectorAll('.feedout-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      feedAction = {feedId: btn.dataset.id, mode:'out', group: btn.dataset.group};
      formOpen[btn.dataset.group] = false;
      render();
      document.getElementById('feedActionForm')?.scrollIntoView({behavior:'smooth', block:'start'});
    });
  });
  document.querySelectorAll('.feedin-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      feedAction = {feedId: btn.dataset.id, mode:'in', group: btn.dataset.group};
      formOpen[btn.dataset.group] = false;
      render();
      document.getElementById('feedActionForm')?.scrollIntoView({behavior:'smooth', block:'start'});
    });
  });
  const cancelFeedActionBtn = document.getElementById('cancelFeedActionBtn');
  if(cancelFeedActionBtn){
    cancelFeedActionBtn.addEventListener('click', ()=>{ feedAction = null; render(); });
  }
  const feedActionForm = document.getElementById('feedActionForm');
  if(feedActionForm){
    feedActionForm.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const mode = feedActionForm.dataset.mode;
      const feedId = feedActionForm.dataset.feedid;
      const group = feedActionForm.dataset.group;
      const g = FEED_GROUPS[group];
      const item = DATA[g.dataKey].find(x=>x.id===feedId);
      if(!item) return;
      const amount = parseFloat(document.getElementById('fa_amount').value) || 0;
      if(amount <= 0){ showToast('Enter an amount greater than 0.'); return; }
      const date = document.getElementById('fa_date').value || new Date().toISOString().slice(0,10);
      const employee = document.getElementById('fa_employee').value || '';
      const notes = document.getElementById('fa_notes').value || '';
      const currentQty = parseFloat(item.quantity) || 0;
      if(mode === 'out'){
        item.quantity = Math.max(0, currentQty - amount);
        DATA[g.logKey].push({id:uid(), feedId:item.id, feedName:item.name, type:'Stock Out', quantity:amount, date, employee, notes, cost:''});
      } else {
        const cost = document.getElementById('fa_cost')?.value || '';
        item.quantity = currentQty + amount;
        DATA[g.logKey].push({id:uid(), feedId:item.id, feedName:item.name, type:'Stock In', quantity:amount, date, employee, notes, cost});
      }
      await saveKind(g.dataKey);
      await saveKind(g.logKey);
      feedAction = null;
      showToast(mode==='out' ? 'Take-out recorded.' : 'Restock recorded.');
      render();
    });
  }
  document.querySelectorAll('.edit-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const kind = activeKind();
      editingId[kind] = btn.dataset.id;
      formOpen[kind] = true;
      render();
      document.getElementById('recordForm')?.scrollIntoView({behavior:'smooth', block:'start'});
    });
  });
  document.querySelectorAll('.delete-btn').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!confirm('Delete this record? This cannot be undone.')) return;
      const kind = activeKind();
      DATA[kind] = DATA[kind].filter(x=>x.id !== btn.dataset.id);
      await saveKind(kind);
      showToast('Record deleted.');
      render();
    });
  });
  const toggleBtn = document.getElementById('toggleFormBtn');
  if(toggleBtn){
    toggleBtn.addEventListener('click', ()=>{
      const kind = activeKind();
      formOpen[kind] = !formOpen[kind];
      editingId[kind] = null;
      render();
    });
  }
  const cancelBtn = document.getElementById('cancelFormBtn');
  if(cancelBtn){
    cancelBtn.addEventListener('click', ()=>{
      const kind = activeKind();
      formOpen[kind] = false;
      editingId[kind] = null;
      render();
    });
  }
  const form = document.getElementById('recordForm');
  if(form){
    form.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const kind = form.dataset.kind;
      const cfg = CONFIG[kind];
      const fd = new FormData(form);
      const record = {};
      cfg.columns.forEach(col=>{ record[col.key] = fd.get(col.key) || ''; });
      const isNewFeedGroup = FEED_GROUPS[kind] && !editingId[kind];
      if(editingId[kind]){
        const idx = DATA[kind].findIndex(x=>x.id===editingId[kind]);
        record.id = editingId[kind];
        DATA[kind][idx] = record;
      } else {
        record.id = uid();
        DATA[kind].push(record);
      }
      if(isNewFeedGroup && parseFloat(record.quantity) > 0){
        const g = FEED_GROUPS[kind];
        DATA[g.logKey].push({id:uid(), feedId:record.id, feedName:record.name, type:'Stock In',
          quantity: record.quantity, date: new Date().toISOString().slice(0,10), employee:'', notes:'Initial stock', cost:''});
        await saveKind(g.logKey);
      }
      await saveKind(kind);
      formOpen[kind] = false;
      editingId[kind] = null;
      showToast('Saved.');
      render();
    });
  }
}

document.getElementById('tabs').addEventListener('click', (e)=>{
  const btn = e.target.closest('button[data-tab]');
  if(!btn) return;
  currentTab = btn.dataset.tab;
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active', b===btn));
  render();
});

/* ---------------- Init ---------------- */
(async function init(){
  await loadAll();
  document.getElementById('loadingNote').style.display = 'none';
  document.getElementById('views').style.display = 'block';
  render();
})();
</script>
</body>
</html>
